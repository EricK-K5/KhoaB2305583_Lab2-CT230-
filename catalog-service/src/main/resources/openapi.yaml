openapi: 3.0.3
info:
  title: Catalog Service API
  version: 1.0.0
paths:
  /api/v1/books:
    get:
      tags:
        - books
      summary: Danh sách sách (có phân trang và tìm kiếm)
      operationId: listBooks
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
    post:
      tags:
        - books
      summary: Tạo sách mới
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
  /api/v1/books/{isbn}:
    get:
      tags:
        - books
      summary: Lấy thông tin sách theo ISBN
      operationId: getBook
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '304':
          description: Not Modified
    put:
      tags:
        - books
      summary: Cập nhật sách
      operationId: updateBook
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdateRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    delete:
      tags:
        - books
      summary: Xóa sách
      operationId: deleteBook
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Thao tác thành công
components:
  schemas:
    Book:
      type: object
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        authorId:
          type: integer
          format: int64
        publishedYear:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    CurrencyCode:
      type: string
      enum:
        - VND
        - USD
        - EUR
    BookCreateRequest:
      type: object
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        authorId:
          type: integer
          format: int64
        publishedYear:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    BookUpdateRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        authorId:
          type: integer
          format: int64
        publishedYear:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    BookPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
